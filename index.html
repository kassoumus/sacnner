<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Scanner de documents</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --ink: #101820;
    --slate: #1b2733;
    --slate-2: #26343f;
    --line: #34444f;
    --paper: #eef1f4;
    --muted: #93a2ae;
    --sun: #f2a900;
    --sun-ink: #2a1d00;
    --ok: #7fd1b9;
    --danger: #ff7a6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); }
  body {
    font-family: "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow: hidden;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  .screen { display: none; height: 100%; flex-direction: column; }
  body[data-screen="scan"] #screen-scan,
  body[data-screen="crop"] #screen-crop,
  body[data-screen="result"] #screen-result,
  body[data-screen="pages"] #screen-pages { display: flex; }
  body[data-screen="ocr"] #screen-ocr { display: flex; }

  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; min-height: 56px;
  }
  .top h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: 0.01em; }
  .status {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 999px;
    background: var(--slate-2); color: var(--muted);
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }

  .auto { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
  .auto input { width: 20px; height: 20px; accent-color: var(--sun); }

  /* Zone caméra */
  #stageWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  #stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: fill; }
  #hint {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; text-align: center;
    background: rgba(16, 24, 32, 0.78);
  }
  #hint:empty { display: none; }
  #dbg {
    display: none; position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 6px;
    font-size: 0.75rem; background: rgba(16, 24, 32, 0.78); color: var(--paper);
  }
  #flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease-out;
  }
  #flash.on { opacity: 0.85; transition: none; }

  /* Barres d’action */
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px 16px;
  }
  .bar.spread { justify-content: stretch; }
  .btn {
    min-height: 48px; padding: 0 18px; border-radius: 12px;
    background: var(--slate-2); font-weight: 600;
  }
  .btn:active { background: var(--line); }
  .btn.primary { background: var(--sun); color: var(--sun-ink); }
  .btn.primary:active { background: #d99700; }
  .btn.danger { color: var(--danger); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }
  .bar .btn.grow { flex: 1; }
  .side { min-width: 92px; }
  .side b {
    display: inline-block; min-width: 22px; margin-left: 6px; padding: 0 6px;
    border-radius: 999px; background: var(--ink); color: var(--sun); font-size: 0.85rem; text-align: center;
  }
  .shutter {
    width: 76px; height: 76px; border-radius: 50%; flex: none;
    background: var(--paper); border: 5px solid var(--ink); box-shadow: 0 0 0 4px var(--paper);
  }
  .shutter:active { transform: scale(0.94); }

  /* Recadrage et aperçu */
  #cropWrap, #resultWrap {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 0 8px; background: var(--ink);
  }
  #cropCanvas { touch-action: none; border-radius: 6px; }
  #resultCanvas {
    width: auto; height: auto; max-width: 100%; max-height: 100%;
    border-radius: 4px; background: #fff;
  }
  .note { padding: 0 16px 4px; font-size: 0.85rem; color: var(--muted); text-align: center; }

  .chips { display: flex; gap: 8px; padding: 12px 16px 0; overflow-x: auto; }
  .chip {
    flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px;
    background: var(--slate-2); font-weight: 600; font-size: 0.92rem;
  }
  .chip[aria-pressed="true"] { background: var(--paper); color: var(--ink); }

  /* Liste des pages */
  #pagesList {
    flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start;
  }
  .page-card { position: relative; background: var(--slate); border-radius: 10px; overflow: hidden; }
  .page-card img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: #fff; }
  .page-card .num {
    position: absolute; left: 8px; top: 8px; min-width: 26px; height: 26px; padding: 0 8px;
    border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
  }
  .page-card .del {
    position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(16, 24, 32, 0.85); color: var(--danger); font-size: 1.3rem; line-height: 1;
  }
  .page-card .ocr {
    position: absolute; left: 8px; bottom: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px;
    background: rgba(16, 24, 32, 0.88); color: var(--paper); font-size: 0.85rem; font-weight: 600;
  }
  .empty { grid-column: 1 / -1; padding: 40px 12px; text-align: center; color: var(--muted); }

  /* Texte extrait (OCR) */
  .bar.tight { padding-bottom: 0; }
  select#ocrLang {
    min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px;
    background: var(--slate-2); color: var(--paper); font: inherit; font-size: 0.9rem;
  }
  #ocrText {
    flex: 1; min-height: 0; margin: 0 16px 8px; padding: 12px; resize: none;
    border: 1px solid var(--line); border-radius: 10px; background: var(--slate); color: var(--paper);
    font: inherit; line-height: 1.5;
  }

  /* Traitement en cours */
  #busy {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: rgba(16, 24, 32, 0.8); z-index: 10;
  }
  #busy.on { display: flex; }
  .spinner {
    width: 38px; height: 38px; border-radius: 50%;
    border: 4px solid var(--line); border-top-color: var(--sun);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 96px);
    padding: 12px 14px; border-radius: 10px; background: var(--paper); color: var(--ink);
    font-weight: 600; text-align: center; display: none; z-index: 11;
  }
  #toast.on { display: block; }
</style>
</head>
<body data-screen="scan">

<!-- 1. Scan -->
<section id="screen-scan" class="screen">
  <header class="top">
    <h1>Scanner</h1>
    <label class="auto"><input type="checkbox" id="chkAuto" checked> Scan automatique</label>
    <span id="status" class="status">Chargement…</span>
  </header>
  <div id="stageWrap">
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div id="dbg"></div>
      <div id="flash"></div>
      <div id="hint"></div>
    </div>
  </div>
  <footer class="bar">
    <button class="btn side" id="btnImport">Importer</button>
    <button class="shutter" id="btnShutter" aria-label="Prendre la photo"></button>
    <button class="btn side" id="btnPages">Pages<b id="pageCount">0</b></button>
  </footer>
  <input type="file" id="fileInput" accept="image/*" hidden>
</section>

<!-- 2. Recadrage -->
<section id="screen-crop" class="screen">
  <header class="top"><h1>Ajuster les coins</h1></header>
  <div id="cropWrap"><canvas id="cropCanvas"></canvas></div>
  <p class="note">Faites glisser les quatre points sur les coins du document.</p>
  <div class="chips"><button class="chip" id="btnOcrRaw">Lire le texte sans redresser</button></div>
  <footer class="bar spread">
    <button class="btn grow" id="btnCropBack">Reprendre</button>
    <button class="btn grow primary" id="btnCropOk">Redresser</button>
  </footer>
</section>

<!-- 3. Aperçu -->
<section id="screen-result" class="screen">
  <header class="top"><h1>Aperçu</h1></header>
  <div id="resultWrap"><canvas id="resultCanvas"></canvas></div>
  <div class="chips" id="chips">
    <button class="chip" data-filter="color" aria-pressed="true">Couleur</button>
    <button class="chip" data-filter="gray" aria-pressed="false">Gris</button>
    <button class="chip" data-filter="bw" aria-pressed="false">Noir et blanc</button>
    <button class="chip" data-filter="orig" aria-pressed="false">Original</button>
    <button class="chip" id="btnOcrResult">Extraire le texte</button>
  </div>
  <footer class="bar spread">
    <button class="btn" id="btnRotate">Pivoter</button>
    <button class="btn" id="btnResultBack">Recadrer</button>
    <button class="btn grow primary" id="btnAddPage">Ajouter la page</button>
  </footer>
</section>

<!-- 4. Pages -->
<section id="screen-pages" class="screen">
  <header class="top">
    <h1 id="pagesTitle">Pages</h1>
    <button class="btn danger" id="btnClear">Tout effacer</button>
  </header>
  <div id="pagesList"></div>
  <div class="bar spread tight">
    <button class="btn grow" id="btnOcrAll">Extraire le texte de toutes les pages</button>
  </div>
  <footer class="bar spread">
    <button class="btn" id="btnMore">Scanner</button>
    <button class="btn grow" id="btnDownload">Télécharger</button>
    <button class="btn grow primary" id="btnShare">Partager le PDF</button>
  </footer>
</section>

<!-- 5. Texte extrait -->
<section id="screen-ocr" class="screen">
  <header class="top">
    <h1>Texte extrait</h1>
    <select id="ocrLang" aria-label="Langue du document">
      <option value="fra">Français</option>
      <option value="eng">Anglais</option>
      <option value="fra+eng">Français et anglais</option>
    </select>
  </header>
  <textarea id="ocrText" spellcheck="false" aria-label="Texte extrait"></textarea>
  <p class="note" id="ocrNote"></p>
  <div class="bar spread tight">
    <button class="btn grow" id="btnOcrCopy">Copier</button>
    <button class="btn grow" id="btnOcrDownload">Télécharger .txt</button>
    <button class="btn grow primary" id="btnOcrShare">Partager</button>
  </div>
  <footer class="bar spread">
    <button class="btn grow" id="btnOcrBack">Retour</button>
  </footer>
</section>

<div id="busy"><div class="spinner"></div><div id="busyText">Traitement…</div></div>
<div id="toast" role="status"></div>

<script>
'use strict';

/* ------------------------------------------------------------------ */
/*  Réglages                                                           */
/* ------------------------------------------------------------------ */
// OpenCV.js : le fichier local « opencv.js » est essayé en premier (si vous le
// placez à côté de index.html), sinon téléchargement unique depuis docs.opencv.org.
const CV_SOURCES = ['./opencv.js', 'https://docs.opencv.org/4.10.0/opencv.js'];
const DETECT_MAX_SIDE = 480;   // taille de l’image analysée pour la détection
const DETECT_EVERY_MS = 150;   // fréquence de détection
const HOLD_MS = 1000;          // durée d’immobilité avant le scan automatique
const GRACE_MS = 1200;         // détection perdue brièvement : les compteurs ne sont pas remis à zéro
const DISPLAY_MS = 500;        // le cadre n’est affiché que s’il a été vu il y a moins de 0,5 s
const REARM_MS = 1200;         // document absent plus longtemps : prêt pour le document suivant
const MOVE_TOL = 0.04;         // tolérance de mouvement des coins (part de la largeur)
const SMOOTH_TOL = 0.02;       // lissage des coins seulement pour un simple tremblement (part de la largeur)
const AGREE_MS = 2500;         // fenêtre pour vérifier que les détections récentes concordent
const AGREE_MIN = 3;           // nombre minimal de détections concordantes avant un scan automatique
const MOTION_THR = 8;          // écart d’image au-delà duquel la caméra est jugée en mouvement
const MIN_AREA = 0.10;         // part minimale de l’image occupée par le document
const MIN_SCORE = 0.18;        // note minimale d’un candidat pour être accepté
const GOOD_SCORE = 0.6;        // note à partir de laquelle on s’arrête de chercher
const CHROMA_THR = 12;         // écart de couleur toléré à l’intérieur du document
const CHROMA_POW = 2;          // poids de l’homogénéité des couleurs dans la note
const BG_TMIN = 6;             // seuil minimal de différence avec le fond
const DEBUG = /[?&#]debug/.test(location.href);  // ajoutez ?debug à l’adresse pour voir la méthode utilisée
const OUTPUT_MAX_SIDE = 2400;  // taille maximale de la page redressée
const IMPORT_MAX_SIDE = 3000;  // taille maximale d’une image importée
const JPEG_QUALITY = 0.85;

const $ = (id) => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
const stage = $('stage'), hint = $('hint');
const cropCanvas = $('cropCanvas'), cropCtx = cropCanvas.getContext('2d');
const resultCanvas = $('resultCanvas');
const detCanvas = document.createElement('canvas');
const detCtx = detCanvas.getContext('2d', { willReadFrequently: true });

const state = {
  cvReady: false,
  stream: null,
  scanning: false,
  raw: null,        // canvas : photo brute
  corners: null,    // [{x,y}] x4 dans le repère de la photo brute (HG, HD, BD, BG)
  warped: null,     // canvas : page redressée, sans filtre
  filter: 'color',
  pages: [],        // { blob, w, h, url }
  lastQuad: null,     // dernier quadrilatère détecté (repère de la vidéo)
  anchor: null,       // quadrilatère de référence pour mesurer l’immobilité
  stableSince: 0,     // instant depuis lequel le document est immobile
  lastSeen: 0,        // dernier instant où un document a été vu
  noQuadSince: 0,     // instant depuis lequel plus rien n’est détecté
  needRearm: false,   // un scan vient d’être fait : attendre un autre document
  doneQuad: null,
  processing: false,
  dbg: null,          // dernier résultat de détection (méthode, note) pour le mode debug
  quadSince: 0,       // instant depuis lequel un document est présent dans le cadre
  hist: [],           // détections récentes { t, q } pour vérifier qu’elles concordent
  motionRef: null,    // petite image de référence pour mesurer le mouvement de la caméra
  motionSince: 0,     // instant depuis lequel la caméra est immobile
  motionBad: 0,       // nombre de mesures de mouvement consécutives au-dessus du seuil
  motionVal: 0,       // dernière mesure de mouvement (pour le message et le mode debug)
  lastCapture: 0
};

const tick = () => new Promise((r) => setTimeout(r, 30));

/* ------------------------------------------------------------------ */
/*  Interface : écrans, messages                                       */
/* ------------------------------------------------------------------ */
function show(name) {
  document.body.dataset.screen = name;
  if (name === 'scan') { terminateOcr(); startCamera(); } else stopCamera();
  if (name === 'crop') drawCrop();
  if (name === 'pages') renderPages();
}

function setStatus(text, kind) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function setHint(text) { hint.textContent = text || ''; }

let toastTimer = null;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 3200);
}

async function busy(text, fn) {
  $('busyText').textContent = text;
  $('busy').classList.add('on');
  await tick();
  try { return await fn(); }
  finally { $('busy').classList.remove('on'); }
}

function updateCount() {
  $('pageCount').textContent = String(state.pages.length);
}

/* ------------------------------------------------------------------ */
/*  Chargement d’OpenCV.js                                             */
/* ------------------------------------------------------------------ */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.async = true;
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error('Échec : ' + src)); };
    document.head.appendChild(s);
  });
}

// Au premier chargement, le service worker n’est pas encore actif : OpenCV (plusieurs Mo) ne
// serait gardé en mémoire qu’à la visite suivante. On le redemande donc une fois le service
// worker prêt ; le cache HTTP du navigateur évite de le retélécharger.
async function warmCache(url) {
  try {
    if (!('serviceWorker' in navigator)) return;
    await navigator.serviceWorker.ready;
    const sameOrigin = new URL(url, location.href).origin === location.origin;
    await fetch(url, { cache: 'force-cache', mode: sameOrigin ? 'same-origin' : 'no-cors' });
  } catch (e) { console.warn('Mise en cache :', e); }
}

async function initCv() {
  setStatus('Chargement d’OpenCV…');
  let loaded = false, loadedSrc = null;
  for (const src of CV_SOURCES) {
    try { await loadScript(src); loaded = true; loadedSrc = src; break; }
    catch (e) { console.warn(e.message); }
  }
  if (!loaded) {
    setStatus('Moteur indisponible', 'err');
    toast('OpenCV n’a pas pu être chargé. Vérifiez la connexion puis rechargez la page.');
    return;
  }
  await new Promise((resolve) => {
    const check = () => {
      if (typeof cv !== 'undefined' && cv.Mat) return resolve();
      setTimeout(check, 100);
    };
    if (typeof cv !== 'undefined' && typeof cv.then === 'function' && !cv.Mat) {
      cv.then((m) => { if (m && m.Mat) window.cv = m; });
    }
    check();
  });
  state.cvReady = true;
  setStatus('Prêt', 'ok');
  warmCache(loadedSrc);
}

/* ------------------------------------------------------------------ */
/*  Détection du document (OpenCV)                                     */
/* ------------------------------------------------------------------ */
// <detection>
function polyArea(q) {
  let a = 0;
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    a += q[i].x * q[j].y - q[j].x * q[i].y;
  }
  return Math.abs(a) / 2;
}

// Note de 0 à 1 : grande taille, forme proche d’un rectangle, côtés opposés comparables.
function scoreQuad(q, w, h, shapeArea) {
  const qa = polyArea(q);
  const frac = qa / (w * h);
  if (frac < MIN_AREA) return 0;
  const fit = Math.min(shapeArea, qa) / Math.max(shapeArea, qa);
  let dev = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[(i + 3) % 4], b = q[i], c = q[(i + 1) % 4];
    const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
    const den = (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y)) || 1;
    const cos = Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / den));
    dev += Math.abs(Math.acos(cos) * 180 / Math.PI - 90);
  }
  const angle = Math.max(0, 1 - dev / 4 / 40);
  const side = (i) => Math.hypot(q[i].x - q[(i + 1) % 4].x, q[i].y - q[(i + 1) % 4].y);
  const l = [side(0), side(1), side(2), side(3)];
  const ratio = (Math.min(l[0], l[2]) / (Math.max(l[0], l[2]) || 1)) *
                (Math.min(l[1], l[3]) / (Math.max(l[1], l[3]) || 1));
  let score = Math.pow(frac, 0.6) * fit * angle * Math.sqrt(ratio);
  // Un quadrilatère collé aux bords de l’image est probablement le cadre lui-même.
  const m = 0.02 * Math.min(w, h);
  const touching = q.filter((p) => p.x < m || p.y < m || p.x > w - m || p.y > h - m).length;
  if (touching >= 3) score *= 0.25;
  return score;
}

// Part des points du quadrilatère dont la couleur (chrominance a et b) reste proche
// de la moyenne. Un vrai document est uniforme ; un quadrilatère qui déborde sur des
// objets ou un fond coloré l’est beaucoup moins. Insensible aux ombres (on ignore la luminosité).
function chromaHomogeneity(lab, q) {
  const cols = lab.cols, rows = lab.rows, d = lab.data;
  const NU = 24, NV = 32;
  const as = new Float32Array(NU * NV), bs = new Float32Array(NU * NV);
  let n = 0, sa = 0, sb = 0;
  for (let i = 0; i < NU; i++) {
    const u = (i + 0.5) / NU;
    const tx = q[0].x + (q[1].x - q[0].x) * u, ty = q[0].y + (q[1].y - q[0].y) * u;
    const bx = q[3].x + (q[2].x - q[3].x) * u, by = q[3].y + (q[2].y - q[3].y) * u;
    for (let j = 0; j < NV; j++) {
      const v = (j + 0.5) / NV;
      const x = Math.min(cols - 1, Math.max(0, Math.round(tx + (bx - tx) * v)));
      const y = Math.min(rows - 1, Math.max(0, Math.round(ty + (by - ty) * v)));
      const k = (y * cols + x) * 3;
      as[n] = d[k + 1]; bs[n] = d[k + 2];
      sa += as[n]; sb += bs[n];
      n++;
    }
  }
  const ma = sa / n, mb = sb / n;
  let ok = 0;
  for (let i = 0; i < n; i++) {
    if (Math.hypot(as[i] - ma, bs[i] - mb) < CHROMA_THR) ok++;
  }
  return ok / n;
}

// Candidats (quadrilatères) trouvés dans un masque binaire.
function candidatesFromMask(mask, w, h, name) {
  const out = [];
  const frameArea = w * h;
  const contours = new cv.MatVector(), hier = new cv.Mat();
  try {
    cv.findContours(mask, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    const list = [];
    for (let i = 0; i < contours.size(); i++) {
      const c = contours.get(i);
      const area = cv.contourArea(c);
      c.delete();
      if (area > frameArea * MIN_AREA && area < frameArea * 0.98) list.push({ i, area });
    }
    list.sort((a, b) => b.area - a.area);
    for (const item of list.slice(0, 4)) {
      const c = contours.get(item.i);
      const hull = new cv.Mat();
      cv.convexHull(c, hull, false, true);
      const hullArea = cv.contourArea(hull);
      const peri = cv.arcLength(hull, true);
      // Tolérance croissante : un papier un peu courbé ou un coin masqué est accepté.
      for (const eps of [0.02, 0.03, 0.045, 0.06]) {
        const ap = new cv.Mat();
        cv.approxPolyDP(hull, ap, eps * peri, true);
        if (ap.rows === 4) {
          const dd = ap.data32S;
          const q = orderCorners([
            { x: dd[0], y: dd[1] }, { x: dd[2], y: dd[3] },
            { x: dd[4], y: dd[5] }, { x: dd[6], y: dd[7] }
          ]);
          const score = scoreQuad(q, w, h, hullArea);
          if (score > 0) out.push({ quad: q, score, name });
          ap.delete();
          break;
        }
        ap.delete();
      }
      hull.delete();
      c.delete();
    }
  } finally {
    contours.delete(); hier.delete();
  }
  return out;
}

function morph(src, dst, op, kernel) {
  cv.morphologyEx(src, dst, op, kernel, new cv.Point(-1, -1), 1,
    cv.BORDER_CONSTANT, cv.morphologyDefaultBorderValue());
}

// Parcourt les pixels de la bordure de l’image (là où il y a le plus de chances de voir le fond).
function forBorder(w, h, fn) {
  const b = Math.max(3, Math.round(Math.min(w, h) * 0.05));
  for (let y = 0; y < h; y++) {
    if (y < b || y >= h - b) { for (let x = 0; x < w; x++) fn(x, y); }
    else {
      for (let x = 0; x < b; x++) fn(x, y);
      for (let x = w - b; x < w; x++) fn(x, y);
    }
  }
}

function histMedian(hist, total) {
  let acc = 0;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc * 2 >= total) return v; }
  return 255;
}

// Masque « tout ce qui ne ressemble pas au fond ». La couleur du fond est la médiane de la
// bordure (robuste même si le document touche le bord) et le seuil s’adapte au bruit du fond.
function backgroundMask(lab, mask, k5, k7) {
  const w = lab.cols, h = lab.rows, d = lab.data;
  const hist = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
  let n = 0;
  forBorder(w, h, (x, y) => {
    const i = (y * w + x) * 3;
    hist[0][d[i]]++; hist[1][d[i + 1]]++; hist[2][d[i + 2]]++;
    n++;
  });
  const bg = [histMedian(hist[0], n), histMedian(hist[1], n), histMedian(hist[2], n)];
  const bgMat = new cv.Mat(h, w, lab.type(), new cv.Scalar(bg[0], bg[1], bg[2], 0));
  const diff = new cv.Mat(), vec = new cv.MatVector();
  const s1 = new cv.Mat(), s2 = new cv.Mat();
  try {
    cv.absdiff(lab, bgMat, diff);
    cv.split(diff, vec);
    const c0 = vec.get(0), c1 = vec.get(1), c2 = vec.get(2);
    cv.add(c0, c1, s1);
    cv.add(s1, c2, s2);
    c0.delete(); c1.delete(); c2.delete();
    const sd = s2.data;
    const h1 = new Uint32Array(256);
    forBorder(w, h, (x, y) => { h1[sd[y * w + x]]++; });
    const med = histMedian(h1, n);
    const h2 = new Uint32Array(256);
    for (let v = 0; v < 256; v++) h2[Math.abs(v - med)] += h1[v];
    const mad = histMedian(h2, n) * 1.4826;
    const T = Math.max(BG_TMIN, med + 3 * mad);
    cv.threshold(s2, mask, T, 255, cv.THRESH_BINARY);
    morph(mask, mask, cv.MORPH_OPEN, k5);
    morph(mask, mask, cv.MORPH_CLOSE, k7);
  } finally {
    bgMat.delete(); diff.delete(); vec.delete(); s1.delete(); s2.delete();
  }
}

// Retourne { quad, score, name } (4 points ordonnés HG, HD, BD, BG dans le repère de l’image
// analysée) ou null. Plusieurs méthodes se complètent ; on garde le candidat le mieux noté :
// grand, proche d’un rectangle, et dont le contenu a une couleur homogène.
function findQuad(src) {
  const w = src.cols, h = src.rows;
  const rgb = new cv.Mat(), rgbBlur = new cv.Mat(), lab = new cv.Mat();
  const gray = new cv.Mat(), blur = new cv.Mat(), mask = new cv.Mat();
  const k3 = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
  const k5 = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
  const k7 = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(7, 7));
  let best = null;

  const take = (name) => {
    for (const c of candidatesFromMask(mask, w, h, name)) {
      if (c.score < MIN_SCORE) continue;
      const hom = chromaHomogeneity(lab, c.quad);
      const final = c.score * Math.pow(hom, CHROMA_POW);
      if (!best || final > best.score) best = { quad: c.quad, score: final, name };
    }
    return !!best && best.score >= GOOD_SCORE;
  };

  const canny = (lo, hi) => () => {
    cv.Canny(blur, mask, lo, hi);
    cv.dilate(mask, mask, k3);
    morph(mask, mask, cv.MORPH_CLOSE, k7);
  };
  const paleOtsu = () => {
    cv.threshold(blur, mask, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
    morph(mask, mask, cv.MORPH_OPEN, k5);
    morph(mask, mask, cv.MORPH_CLOSE, k7);
  };
  const whitePaper = () => {
    const hsv = new cv.Mat();
    let low = null, high = null;
    try {
      cv.cvtColor(rgb, hsv, cv.COLOR_RGB2HSV, 0);
      const vLow = Math.max(70, Math.min(190, cv.mean(hsv)[2] * 0.95));
      low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), new cv.Scalar(0, 0, vLow, 0));
      high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), new cv.Scalar(180, 70, 255, 255));
      cv.inRange(hsv, low, high, mask);
      morph(mask, mask, cv.MORPH_OPEN, k5);
      morph(mask, mask, cv.MORPH_CLOSE, k7);
    } finally {
      hsv.delete(); if (low) low.delete(); if (high) high.delete();
    }
  };

  try {
    cv.cvtColor(src, rgb, cv.COLOR_RGBA2RGB, 0);
    cv.GaussianBlur(rgb, rgbBlur, new cv.Size(5, 5), 0);
    cv.cvtColor(rgbBlur, lab, cv.COLOR_RGB2Lab, 0);
    cv.cvtColor(rgb, gray, cv.COLOR_RGB2GRAY, 0);
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);

    const steps = [
      ['contours', canny(60, 160)],
      ['contours sensibles', canny(25, 75)],
      ['papier clair', paleOtsu],
      ['papier blanc', whitePaper],
      ['fond', () => backgroundMask(lab, mask, k5, k7)]
    ];
    for (const [name, prepare] of steps) {
      let done = false;
      try { prepare(); done = take(name); } catch (e) { console.warn(name, e); }
      if (done) break;
    }
  } finally {
    rgb.delete(); rgbBlur.delete(); lab.delete(); gray.delete(); blur.delete(); mask.delete();
    k3.delete(); k5.delete(); k7.delete();
  }
  return best ? { quad: best.quad, score: best.score, name: best.name } : null;
}
// </detection>

function orderCorners(pts) {
  const sum = (p) => p.x + p.y, diff = (p) => p.x - p.y;
  const tl = pts.reduce((a, b) => (sum(b) < sum(a) ? b : a));
  const br = pts.reduce((a, b) => (sum(b) > sum(a) ? b : a));
  const tr = pts.reduce((a, b) => (diff(b) > diff(a) ? b : a));
  const bl = pts.reduce((a, b) => (diff(b) < diff(a) ? b : a));
  return [tl, tr, br, bl];
}

function defaultCorners(w, h) {
  const mx = w * 0.08, my = h * 0.08;
  return [
    { x: mx, y: my }, { x: w - mx, y: my },
    { x: w - mx, y: h - my }, { x: mx, y: h - my }
  ];
}

// Détection sur une image (canvas) de n’importe quelle taille, résultat dans son repère.
function detectOnCanvas(canvas) {
  if (!state.cvReady) return null;
  const sc = Math.min(1, DETECT_MAX_SIDE / Math.max(canvas.width, canvas.height));
  const dw = Math.max(1, Math.round(canvas.width * sc));
  const dh = Math.max(1, Math.round(canvas.height * sc));
  detCanvas.width = dw; detCanvas.height = dh;
  detCtx.drawImage(canvas, 0, 0, dw, dh);
  let res = null;
  const src = cv.imread(detCanvas);
  try { res = findQuad(src); } finally { src.delete(); }
  state.dbg = res ? { name: res.name, score: res.score } : null;
  return res ? res.quad.map((p) => ({ x: p.x / sc, y: p.y / sc })) : null;
}

/* ------------------------------------------------------------------ */
/*  Caméra                                                             */
/* ------------------------------------------------------------------ */
function layoutStage() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const wrap = $('stageWrap');
  const aw = wrap.clientWidth - 16, ah = wrap.clientHeight;
  const s = Math.min(aw / vw, ah / vh);
  stage.style.width = Math.floor(vw * s) + 'px';
  stage.style.height = Math.floor(vh * s) + 'px';
}
video.addEventListener('loadedmetadata', layoutStage);
window.addEventListener('resize', () => {
  layoutStage();
  if (document.body.dataset.screen === 'crop') drawCrop();
});

async function startCamera() {
  if (state.stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setHint('Caméra non disponible ici. Ouvrez la page en HTTPS ou utilisez « Importer ».');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    if (document.body.dataset.screen !== 'scan') { stream.getTracks().forEach((t) => t.stop()); return; }
    state.stream = stream;
    video.srcObject = stream;
    await video.play().catch(() => {});
    layoutStage();
    setHint('Placez le document dans le cadre');
    state.scanning = true;
    resetTracking();
    requestAnimationFrame(loop);
  } catch (e) {
    const msg = e && e.name === 'NotAllowedError'
      ? 'Accès à la caméra refusé. Autorisez-le dans les réglages du navigateur, ou utilisez « Importer ».'
      : 'Caméra indisponible : ' + (e && e.message ? e.message : 'erreur inconnue');
    setHint(msg);
  }
}

function stopCamera() {
  state.scanning = false;
  if (state.stream) { state.stream.getTracks().forEach((t) => t.stop()); state.stream = null; }
  video.srcObject = null;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  resetTracking();
}

/* Mouvement de la caméra : on compare de petites images (64 x 48), sans leur luminosité
   moyenne pour ignorer les changements d’exposition. Indépendant de la détection des bords. */
const motCanvas = document.createElement('canvas');
motCanvas.width = 64; motCanvas.height = 48;
const motCtx = motCanvas.getContext('2d', { willReadFrequently: true });
if ('imageSmoothingQuality' in motCtx) motCtx.imageSmoothingQuality = 'high';

function sampleFrame() {
  motCtx.drawImage(video, 0, 0, 64, 48);
  const d = motCtx.getImageData(0, 0, 64, 48).data;
  const g = new Float32Array(64 * 48);
  let sum = 0;
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    sum += g[j];
  }
  const mean = sum / g.length;
  for (let j = 0; j < g.length; j++) g[j] -= mean;
  return g;
}

function frameDiff(a, b) {
  let sum = 0;
  for (let i = 0; i < a.length; i++) sum += Math.abs(a[i] - b[i]);
  return sum / a.length;
}

// La référence reste fixe tant que la caméra est immobile : une dérive lente est détectée aussi.
function updateMotion(now, cur) {
  if (!state.motionRef) {
    state.motionRef = cur; state.motionSince = now; state.motionBad = 0;
    return;
  }
  const m = frameDiff(cur, state.motionRef);
  state.motionVal = m;
  if (m > MOTION_THR * 2) {
    state.motionBad = 2;
  } else if (m > MOTION_THR) {
    state.motionBad++;
  } else {
    state.motionBad = 0;
  }
  if (state.motionBad >= 2) {   // une seule mesure isolée est tolérée (tremblement de la main)
    state.motionRef = cur; state.motionSince = now; state.motionBad = 0;
  }
}

let lastDetect = 0;
function loop(ts) {
  if (!state.scanning) return;
  requestAnimationFrame(loop);
  if (!state.cvReady || state.processing || video.readyState < 2 || !video.videoWidth) return;
  if (ts - lastDetect < DETECT_EVERY_MS) return;
  lastDetect = ts;
  try { updateMotion(performance.now(), sampleFrame()); } catch (e) { console.warn(e); }
  detectFrame();
}

function detectFrame() {
  let quad = null;
  try {
    const t0 = performance.now();
    quad = detectOnCanvas(video);
    if (DEBUG) {
      $('dbg').textContent = (state.dbg
        ? state.dbg.name + ', note ' + state.dbg.score.toFixed(2)
        : 'rien détecté') + ', ' + Math.round(performance.now() - t0) + ' ms, mouvement ' +
        state.motionVal.toFixed(1) + ', immobile ' +
        (state.motionSince ? ((performance.now() - state.motionSince) / 1000).toFixed(1) : '0.0') + ' s';
    }
  } catch (e) {
    console.error(e);
    setHint('Erreur de détection : ' + (e && e.message ? e.message : e));
    return;
  }
  updateOverlay(quad);
}

function resetTracking() {
  state.lastQuad = null;
  state.anchor = null;
  state.stableSince = 0;
  state.lastSeen = 0;
  state.noQuadSince = 0;
  state.needRearm = false;
  state.doneQuad = null;
  state.quadSince = 0;
  state.hist = [];
  state.motionRef = null;
  state.motionSince = 0;
  state.motionBad = 0;
}

function sameQuad(a, b, tol) {
  return a.every((p, i) => Math.hypot(p.x - b[i].x, p.y - b[i].y) < tol);
}

// Contrôle de fiabilité : au moins AGREE_MIN détections récentes concordent avec le cadre affiché.
// Si ce n’est pas le cas, la détection est trop instable pour un scan automatique.
function quadsAgree(now, ref, tol) {
  return state.hist.filter((h) => now - h.t <= AGREE_MS && sameQuad(h.q, ref, tol)).length >= AGREE_MIN;
}

function updateOverlay(quad) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (overlay.width !== vw || overlay.height !== vh) { overlay.width = vw; overlay.height = vh; }
  octx.clearRect(0, 0, vw, vh);

  const now = performance.now();
  const tol = vw * MOVE_TOL;
  const auto = $('chkAuto').checked;

  // Lissage : réduit le tremblement des coins d’une image à l’autre. Si le cadre change
  // vraiment (autre candidat, document déplacé), on le prend tel quel : aucun mélange.
  if (quad && state.lastQuad && sameQuad(quad, state.lastQuad, vw * SMOOTH_TOL)) {
    const prev = state.lastQuad;
    quad = quad.map((p, i) => ({ x: 0.55 * p.x + 0.45 * prev[i].x, y: 0.55 * p.y + 0.45 * prev[i].y }));
  }

  if (quad) {
    if (!state.quadSince) state.quadSince = now;
    state.lastSeen = now;
    state.hist.push({ t: now, q: quad });
    state.hist = state.hist.filter((h) => now - h.t <= AGREE_MS);
    state.noQuadSince = 0;
    // Un scan vient d’être fait : on attend que le document change ou soit retiré.
    if (state.needRearm && state.doneQuad && !sameQuad(quad, state.doneQuad, tol * 2)) {
      state.needRearm = false;
    }
    // Le compteur d’immobilité repart seulement si les coins ont vraiment bougé.
    if (!state.anchor || !sameQuad(quad, state.anchor, tol)) {
      state.anchor = quad;
      state.stableSince = now;
    }
    state.lastQuad = quad;
  } else {
    if (!state.noQuadSince) state.noQuadSince = now;
    // Une détection manquée ne remet pas le compteur à zéro avant GRACE_MS.
    if (now - state.noQuadSince > REARM_MS) state.needRearm = false;
    if (now - state.lastSeen > GRACE_MS) {
      state.anchor = null;
      state.lastQuad = null;
      state.stableSince = 0;
      state.quadSince = 0;
    }
  }

  const q = state.lastQuad && now - state.lastSeen <= DISPLAY_MS ? state.lastQuad : null;
  if (!q) {
    setHint(now - state.noQuadSince > 3000
      ? 'Aucun contour net. Posez le document sur un fond contrasté, ou utilisez le bouton.'
      : 'Placez le document dans le cadre');
    return;
  }

  // Deux façons d’être « immobile » : les coins du document ne bougent pas, OU la caméra
  // entière ne bouge pas (et un document est présent depuis aussi longtemps).
  const quadHeld = state.stableSince ? now - state.stableSince : 0;
  const camHeld = state.motionSince && state.quadSince
    ? Math.min(now - state.motionSince, now - state.quadSince) : 0;
  const held = Math.max(quadHeld, camHeld);
  const progress = state.needRearm ? 1 : Math.min(1, held / HOLD_MS);
  const color = progress >= 1 ? '#7fd1b9' : '#f2a900';

  octx.lineJoin = 'round';
  octx.lineWidth = Math.max(3, vw * 0.006);
  octx.strokeStyle = color;
  octx.fillStyle = progress >= 1 ? 'rgba(127, 209, 185, 0.18)' : 'rgba(242, 169, 0, 0.14)';
  octx.beginPath();
  q.forEach((p, i) => (i ? octx.lineTo(p.x, p.y) : octx.moveTo(p.x, p.y)));
  octx.closePath();
  octx.fill();
  octx.stroke();
  octx.fillStyle = color;
  q.forEach((p) => { octx.beginPath(); octx.arc(p.x, p.y, vw * 0.011, 0, Math.PI * 2); octx.fill(); });
  if (auto && !state.needRearm) {
    octx.fillRect(0, 0, vw * progress, Math.max(4, vh * 0.008));  // barre de progression
  }

  if (state.needRearm) {
    setHint('Page ajoutée. Passez au document suivant.');
  } else if (!auto) {
    setHint('Document détecté, appuyez sur le bouton.');
  } else if (progress < 1) {
    setHint(state.motionVal > MOTION_THR
      ? 'Stabilisez le téléphone…'
      : 'Ne bougez pas… ' + Math.max(0.1, (HOLD_MS - held) / 1000).toFixed(1) + ' s');
  } else {
    setHint('Capture…');
  }

  if (auto && !state.needRearm && held >= HOLD_MS && Date.now() - state.lastCapture > 1500) {
    if (quadsAgree(now, q, tol * 1.5)) autoScan(q.map((p) => ({ x: p.x, y: p.y })));
    else setHint('Détection instable, recadrez le document.');
  }
}

function grabFrame() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const c = document.createElement('canvas');
  c.width = vw; c.height = vh;
  c.getContext('2d').drawImage(video, 0, 0, vw, vh);
  return c;
}

function flash() {
  const el = $('flash');
  el.classList.add('on');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('on')));
}

// Scan automatique : photo, redressement, filtre et ajout de la page, sans écran intermédiaire.
async function autoScan(quad) {
  if (state.processing || !quad) return;
  state.processing = true;
  try {
    const raw = grabFrame();
    if (!raw) return;
    state.lastCapture = Date.now();
    state.needRearm = true;
    state.doneQuad = quad;
    state.anchor = null;
    state.stableSince = 0;
    state.motionRef = null;
    state.motionSince = 0;
    if (navigator.vibrate) navigator.vibrate(40);
    flash();
    await tick();
    state.raw = raw;
    state.corners = quad;
    state.warped = warpToCanvas(raw, quad);
    applyFilter();
    await commitPage();
    toast('Page ' + state.pages.length + ' ajoutée');
    updateCount();
  } catch (e) {
    console.error(e);
    toast('Le scan automatique a échoué. Utilisez le bouton rond.');
  } finally {
    state.processing = false;
  }
}

// Capture manuelle : passe par l’écran de recadrage pour ajuster les coins.
function capture() {
  if (state.processing) return;
  const c = grabFrame();
  if (!c) return;
  state.raw = c;
  const fresh = state.lastQuad && performance.now() - state.lastSeen <= DISPLAY_MS;
  let corners = fresh ? state.lastQuad.map((p) => ({ x: p.x, y: p.y })) : null;
  if (!corners) {
    try { corners = detectOnCanvas(c); } catch (e) { console.error(e); }
  }
  state.corners = corners || defaultCorners(c.width, c.height);
  state.lastCapture = Date.now();
  resetTracking();
  if (navigator.vibrate) navigator.vibrate(30);
  show('crop');
}

/* ------------------------------------------------------------------ */
/*  Import depuis la galerie                                           */
/* ------------------------------------------------------------------ */
async function imageToCanvas(file) {
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    bmp = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  const w0 = bmp.width, h0 = bmp.height;
  const sc = Math.min(1, IMPORT_MAX_SIDE / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return c;
}

$('btnImport').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    await busy('Ouverture de l’image…', async () => {
      const c = await imageToCanvas(file);
      state.raw = c;
      let quad = null;
      try { quad = detectOnCanvas(c); } catch (err) { console.error(err); }
      state.corners = quad || defaultCorners(c.width, c.height);
    });
    show('crop');
  } catch (err) {
    console.error(err);
    toast('Impossible d’ouvrir cette image.');
  }
});

/* ------------------------------------------------------------------ */
/*  Écran de recadrage (4 coins déplaçables)                           */
/* ------------------------------------------------------------------ */
const crop = { s: 1, dpr: 1, drag: -1 };

function drawCrop() {
  if (!state.raw) return;
  const wrap = $('cropWrap');
  const aw = wrap.clientWidth - 16, ah = wrap.clientHeight - 8;
  const s = Math.min(aw / state.raw.width, ah / state.raw.height);
  const cw = Math.max(1, Math.round(state.raw.width * s));
  const ch = Math.max(1, Math.round(state.raw.height * s));
  const dpr = window.devicePixelRatio || 1;
  cropCanvas.style.width = cw + 'px';
  cropCanvas.style.height = ch + 'px';
  cropCanvas.width = Math.round(cw * dpr);
  cropCanvas.height = Math.round(ch * dpr);
  crop.s = s; crop.dpr = dpr;
  renderCrop();
}

function renderCrop() {
  const { s, dpr } = crop;
  const cw = cropCanvas.width / dpr, ch = cropCanvas.height / dpr;
  cropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cropCtx.clearRect(0, 0, cw, ch);
  cropCtx.drawImage(state.raw, 0, 0, state.raw.width * s, state.raw.height * s);

  const pts = state.corners.map((p) => ({ x: p.x * s, y: p.y * s }));
  cropCtx.lineJoin = 'round';
  cropCtx.lineWidth = 3;
  cropCtx.strokeStyle = '#f2a900';
  cropCtx.fillStyle = 'rgba(242, 169, 0, 0.16)';
  cropCtx.beginPath();
  pts.forEach((p, i) => (i ? cropCtx.lineTo(p.x, p.y) : cropCtx.moveTo(p.x, p.y)));
  cropCtx.closePath();
  cropCtx.fill();
  cropCtx.stroke();
  pts.forEach((p) => {
    cropCtx.beginPath();
    cropCtx.arc(p.x, p.y, 15, 0, Math.PI * 2);
    cropCtx.fillStyle = 'rgba(16, 24, 32, 0.55)';
    cropCtx.fill();
    cropCtx.lineWidth = 3;
    cropCtx.strokeStyle = '#f2a900';
    cropCtx.stroke();
  });
}

function cropPoint(e) {
  const r = cropCanvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

cropCanvas.addEventListener('pointerdown', (e) => {
  const p = cropPoint(e);
  let best = -1, bestD = 44; // rayon de prise en pixels CSS
  state.corners.forEach((c, i) => {
    const d = Math.hypot(c.x * crop.s - p.x, c.y * crop.s - p.y);
    if (d < bestD) { bestD = d; best = i; }
  });
  if (best >= 0) {
    crop.drag = best;
    cropCanvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
});
cropCanvas.addEventListener('pointermove', (e) => {
  if (crop.drag < 0) return;
  const p = cropPoint(e);
  const x = Math.min(state.raw.width, Math.max(0, p.x / crop.s));
  const y = Math.min(state.raw.height, Math.max(0, p.y / crop.s));
  state.corners[crop.drag] = { x, y };
  renderCrop();
});
['pointerup', 'pointercancel'].forEach((ev) =>
  cropCanvas.addEventListener(ev, () => { crop.drag = -1; })
);

$('btnCropBack').addEventListener('click', () => show('scan'));
$('btnCropOk').addEventListener('click', async () => {
  try {
    await busy('Redressement…', async () => {
      state.warped = warpToCanvas(state.raw, state.corners);
      applyFilter();
    });
    show('result');
  } catch (err) {
    console.error(err);
    toast('Le redressement a échoué. Ajustez les coins et réessayez.');
  }
});

/* ------------------------------------------------------------------ */
/*  Redressement de perspective et filtres                             */
/* ------------------------------------------------------------------ */
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function warpToCanvas(rawCanvas, pts) {
  const [tl, tr, br, bl] = pts;
  let W = Math.round(Math.max(dist(br, bl), dist(tr, tl)));
  let H = Math.round(Math.max(dist(tr, br), dist(tl, bl)));
  if (W < 20 || H < 20) throw new Error('Zone trop petite');
  const k = Math.min(1, OUTPUT_MAX_SIDE / Math.max(W, H));
  W = Math.round(W * k); H = Math.round(H * k);

  const src = cv.imread(rawCanvas);
  const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2,
    [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
  const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, W, 0, W, H, 0, H]);
  const M = cv.getPerspectiveTransform(srcTri, dstTri);
  const dst = new cv.Mat();
  const out = document.createElement('canvas');
  try {
    cv.warpPerspective(src, dst, M, new cv.Size(W, H), cv.INTER_LINEAR, cv.BORDER_REPLICATE);
    cv.imshow(out, dst);
  } finally {
    src.delete(); srcTri.delete(); dstTri.delete(); M.delete(); dst.delete();
  }
  return out;
}

// Supprime les ombres et uniformise le fond (le papier devient blanc, le texte reste net).
function normalize(src) {
  const w = Math.max(8, Math.round(src.cols / 8));
  const h = Math.max(8, Math.round(src.rows / 8));
  const small = new cv.Mat(), bg = new cv.Mat(), out = new cv.Mat();
  const kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
  try {
    cv.resize(src, small, new cv.Size(w, h), 0, 0, cv.INTER_AREA);
    cv.dilate(small, small, kernel);
    cv.GaussianBlur(small, small, new cv.Size(0, 0), 5);
    cv.resize(small, bg, new cv.Size(src.cols, src.rows), 0, 0, cv.INTER_LINEAR);
    cv.divide(src, bg, out, 255, -1);
  } catch (e) {
    out.delete();
    throw e;
  } finally {
    small.delete(); bg.delete(); kernel.delete();
  }
  return out;
}

function applyFilter() {
  const src = cv.imread(state.warped);
  try {
    if (state.filter === 'orig') {
      cv.imshow(resultCanvas, src);
      return;
    }
    const n = normalize(src);
    try {
      if (state.filter === 'color') {
        cv.imshow(resultCanvas, n);
      } else {
        const g = new cv.Mat();
        try {
          cv.cvtColor(n, g, cv.COLOR_RGBA2GRAY);
          if (state.filter === 'gray') {
            cv.imshow(resultCanvas, g);
          } else {
            const t = new cv.Mat();
            try {
              cv.adaptiveThreshold(g, t, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 41, 15);
              cv.imshow(resultCanvas, t);
            } finally { t.delete(); }
          }
        } finally { g.delete(); }
      }
    } finally { n.delete(); }
  } finally {
    src.delete();
  }
}

$('chips').addEventListener('click', async (e) => {
  const btn = e.target.closest('.chip');
  if (!btn || !btn.dataset.filter) return;
  state.filter = btn.dataset.filter;
  document.querySelectorAll('#chips .chip[data-filter]').forEach((c) =>
    c.setAttribute('aria-pressed', String(c === btn)));
  await busy('Application du filtre…', async () => applyFilter());
});

$('btnRotate').addEventListener('click', async () => {
  await busy('Rotation…', async () => {
    const w = state.warped;
    const c = document.createElement('canvas');
    c.width = w.height; c.height = w.width;
    const x = c.getContext('2d');
    x.translate(c.width, 0);
    x.rotate(Math.PI / 2);
    x.drawImage(w, 0, 0);
    state.warped = c;
    applyFilter();
  });
});

$('btnResultBack').addEventListener('click', () => show('crop'));

async function commitPage() {
  const blob = await new Promise((r) => resultCanvas.toBlob(r, 'image/jpeg', JPEG_QUALITY));
  if (!blob) throw new Error('Encodage JPEG impossible');
  state.pages.push({
    blob, w: resultCanvas.width, h: resultCanvas.height, url: URL.createObjectURL(blob)
  });
  updateCount();
}

$('btnAddPage').addEventListener('click', async () => {
  try {
    await busy('Enregistrement de la page…', commitPage);
  } catch (e) {
    console.error(e);
    toast('Impossible d’enregistrer la page.');

  }
  toast('Page ' + state.pages.length + ' ajoutée');

/* ------------------------------------------------------------------ */
/*  Liste des pages                                                    */
/* ------------------------------------------------------------------ */
$('btnPages').addEventListener('click', () => show('pages'));
$('btnMore').addEventListener('click', () => show('scan'));

function renderPages() {
  const list = $('pagesList');
  const n = state.pages.length;
  $('pagesTitle').textContent = n ? 'Pages (' + n + ')' : 'Pages';
  $('btnClear').disabled = !n;
  $('btnDownload').disabled = !n;
  $('btnShare').disabled = !n;
  list.textContent = '';
  if (!n) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'Aucune page pour l’instant. Scannez un document pour commencer.';
    list.appendChild(p);
    return;
  }
  state.pages.forEach((page, i) => {
    const card = document.createElement('div');
    card.className = 'page-card';
    const img = document.createElement('img');
    img.src = page.url;
    img.alt = 'Page ' + (i + 1);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i + 1);
    const del = document.createElement('button');
    del.className = 'del';
    del.setAttribute('aria-label', 'Supprimer la page ' + (i + 1));
    del.textContent = '×';
    del.addEventListener('click', () => {
      URL.revokeObjectURL(page.url);
      state.pages.splice(i, 1);
      updateCount();
      renderPages();
    });
    const read = document.createElement('button');
    read.className = 'ocr';
    read.textContent = 'Texte';
    read.setAttribute('aria-label', 'Extraire le texte de la page ' + (i + 1));
    read.addEventListener('click', () => runOcr([{ label: 'Page ' + (i + 1), input: page.blob, trim: true }], 'pages'));
    card.append(img, num, del, read);
    list.appendChild(card);
  });
}

$('btnClear').addEventListener('click', () => {
  if (!confirm('Supprimer toutes les pages ?')) return;
  state.pages.forEach((p) => URL.revokeObjectURL(p.url));
  state.pages = [];
  updateCount();
  renderPages();
});

/* ------------------------------------------------------------------ */
/*  Export PDF (sans bibliothèque : un JPEG par page)                  */
/* ------------------------------------------------------------------ */
function buildPdf(pages) {
  const enc = new TextEncoder();
  const chunks = [];
  const offsets = [];
  let offset = 0;
  const push = (d) => {
    const b = typeof d === 'string' ? enc.encode(d) : d;
    chunks.push(b);
    offset += b.length;
  };
  const obj = (id, fn) => {
    offsets[id] = offset;
    push(id + ' 0 obj\n');
    fn();
    push('\nendobj\n');
  };
  const n = pages.length;
  push('%PDF-1.4\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  const kids = pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ');
  obj(2, () => push('<< /Type /Pages /Kids [' + kids + '] /Count ' + n + ' >>'));

  pages.forEach((p, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
    // La page tient dans un A4 (595 x 842 pt) en gardant les proportions de l’image.
    const s = Math.min(595 / p.w, 842 / p.h);
    const pw = (p.w * s).toFixed(2), ph = (p.h * s).toFixed(2);
    obj(pid, () => push(
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] ' +
      '/Resources << /XObject << /Im0 ' + iid + ' 0 R >> >> /Contents ' + cid + ' 0 R >>'));
    const content = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q';
    obj(cid, () => push('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream'));
    obj(iid, () => {
      push('<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.jpeg.length +
        ' >>\nstream\n');
      push(p.jpeg);
      push('\nendstream');
    });
  });

  const total = 3 * n + 3;
  const xrefPos = offset;
  let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
  for (let id = 1; id < total; id++) x += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
  push(x);
  push('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF');
  return new Blob(chunks, { type: 'application/pdf' });
}

async function makePdf() {
  const items = [];
  for (const p of state.pages) {
    items.push({ jpeg: new Uint8Array(await p.blob.arrayBuffer()), w: p.w, h: p.h });
  }
  return buildPdf(items);
}

function pdfName() {
  const d = new Date(), z = (v) => String(v).padStart(2, '0');
  return 'Scan_' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) +
    '_' + z(d.getHours()) + z(d.getMinutes()) + '.pdf';
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

$('btnDownload').addEventListener('click', async () => {
  if (!state.pages.length) return;
  await busy('Création du PDF…', async () => downloadBlob(await makePdf(), pdfName()));
  toast('PDF enregistré dans les téléchargements');
});

$('btnShare').addEventListener('click', async () => {
  if (!state.pages.length) return;
  const name = pdfName();
  let blob;
  await busy('Création du PDF…', async () => { blob = await makePdf(); });
  const file = new File([blob], name, { type: 'application/pdf' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
    } else {
      downloadBlob(blob, name);
      toast('Partage indisponible, PDF téléchargé à la place');
    }
  } catch (e) {
    if (e && e.name !== 'AbortError') { console.error(e); downloadBlob(blob, name); }
  }
});

/* ------------------------------------------------------------------ */
/*  Reconnaissance de texte (OCR) avec Tesseract.js                    */
/* ------------------------------------------------------------------ */
// Les fichiers du dossier « ocr/ » (à côté de index.html) sont utilisés en priorité : ils
// fonctionnent hors ligne. S’ils sont absents, tout est téléchargé une fois depuis jsDelivr.
const OCR_VERSION = '7.0.0';
const OCR_CORE_VERSION = '6.1.2';
const OCR_CDN = 'https://cdn.jsdelivr.net/npm/';
const ocr = { worker: null, lang: null, local: null, sources: [], returnTo: 'result', prefix: '' };

function wasmSimd() {
  try {
    return WebAssembly.validate(new Uint8Array(
      [0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]));
  } catch (e) { return false; }
}

async function ocrHasLocal() {
  if (ocr.local !== null) return ocr.local;
  try { ocr.local = (await fetch('ocr/worker.min.js')).ok; } catch (e) { ocr.local = false; }
  return ocr.local;
}

async function loadOcrLib() {
  if (window.Tesseract) return;
  const sources = [OCR_CDN + 'tesseract.js@' + OCR_VERSION + '/dist/tesseract.min.js'];
  if (await ocrHasLocal()) sources.unshift('ocr/tesseract.min.js');
  for (const src of sources) {
    try { await loadScript(src); if (window.Tesseract) return; } catch (e) { console.warn(e.message); }
  }
  throw new Error('Tesseract indisponible');
}

function ocrLogger(m) {
  const labels = {
    'loading tesseract core': 'Chargement du moteur',
    'initializing tesseract': 'Initialisation',
    'loading language traineddata': 'Chargement de la langue',
    'initializing api': 'Initialisation',
    'recognizing text': 'Lecture du texte'
  };
  const label = labels[m.status];
  if (!label) return;
  const pct = typeof m.progress === 'number' ? ' ' + Math.round(m.progress * 100) + ' %' : '';
  $('busyText').textContent = ocr.prefix + label + pct;
}

async function terminateOcr() {
  const w = ocr.worker;
  ocr.worker = null;
  ocr.lang = null;
  if (w) { try { await w.terminate(); } catch (e) { console.warn(e); } }
}

async function getOcrWorker(lang) {
  if (ocr.worker && ocr.lang === lang) return ocr.worker;
  await terminateOcr();
  await loadOcrLib();
  const local = await ocrHasLocal();
  const abs = (path) => new URL(path, location.href).href;
  const simd = wasmSimd();
  const cdnCore = OCR_CDN + 'tesseract.js-core@' + OCR_CORE_VERSION +
    '/tesseract-core' + (simd ? '-simd' : '') + '-lstm.wasm.js';
  const options = { logger: ocrLogger, errorHandler: (e) => console.error(e) };
  if (local) {
    options.workerPath = abs('ocr/worker.min.js');
    options.workerBlobURL = false;           // même origine : le service worker garde les fichiers
    options.langPath = abs('ocr/lang');
    options.corePath = simd ? abs('ocr/tesseract-core-simd-lstm.wasm.js') : cdnCore;
  } else {
    options.corePath = cdnCore;
  }
  const worker = await Tesseract.createWorker(lang, 1, options);   // 1 = moteur LSTM
  ocr.worker = worker;
  ocr.lang = lang;
  return worker;
}

// Prépare l’image pour la lecture : on rogne une fine marge (les bords d’une page redressée
// contiennent souvent un liseré sombre lu à tort comme des « | ») puis on ajoute un bord blanc.
async function prepareOcrImage(input, trim) {
  const src = input instanceof Blob ? await createImageBitmap(input) : input;
  const w = src.width, h = src.height, base = Math.min(w, h);
  const m = trim ? Math.round(base * 0.012) : 0;
  const pad = Math.round(base * 0.02);
  const c = document.createElement('canvas');
  c.width = w - 2 * m + 2 * pad;
  c.height = h - 2 * m + 2 * pad;
  const x = c.getContext('2d');
  x.fillStyle = '#fff';
  x.fillRect(0, 0, c.width, c.height);
  x.drawImage(src, m, m, w - 2 * m, h - 2 * m, pad, pad, w - 2 * m, h - 2 * m);
  if (src.close) src.close();
  return c;
}

async function runOcr(sources, returnTo) {
  if (!sources.length) { toast('Aucune page à lire.'); return; }
  ocr.sources = sources;
  ocr.returnTo = returnTo;
  const lang = $('ocrLang').value;
  const parts = [];
  try {
    await busy('Préparation de la lecture…', async () => {
      const worker = await getOcrWorker(lang);
      for (let i = 0; i < sources.length; i++) {
        ocr.prefix = sources.length > 1 ? 'Page ' + (i + 1) + ' sur ' + sources.length + ' : ' : '';
        $('busyText').textContent = ocr.prefix + 'Lecture du texte';
        const image = await prepareOcrImage(sources[i].input, sources[i].trim);
        const { data } = await worker.recognize(image);
        parts.push({ label: sources[i].label, text: data.text.trim(), conf: data.confidence });
      }
    });
  } catch (e) {
    console.error(e);
    toast('La lecture du texte a échoué. Une première connexion est nécessaire pour charger le moteur.');
    return;
  } finally {
    ocr.prefix = '';
  }

  const text = parts.length > 1
    ? parts.map((p) => '--- ' + p.label + ' ---\n' + p.text).join('\n\n')
    : parts[0].text;
  $('ocrText').value = text;
  const withText = parts.filter((p) => p.text);
  const conf = withText.length ? withText.reduce((a, p) => a + p.conf, 0) / withText.length : 0;
  $('ocrNote').textContent = !withText.length
    ? 'Aucun texte détecté. Essayez le filtre Gris ou Noir et blanc, ou une photo plus nette et mieux éclairée.'
    : conf < 60
      ? 'Lecture peu fiable (' + Math.round(conf) + ' %). Vérifiez la langue choisie, la netteté et l’éclairage.'
      : 'Confiance moyenne : ' + Math.round(conf) + ' %. Relisez et corrigez le texte au besoin.';
  show('ocr');
}

$('btnOcrResult').addEventListener('click', () =>
  runOcr([{ label: 'Page', input: resultCanvas, trim: true }], 'result'));
$('btnOcrRaw').addEventListener('click', () =>
  runOcr([{ label: 'Image', input: state.raw, trim: false }], 'crop'));
$('btnOcrAll').addEventListener('click', () =>
  runOcr(state.pages.map((p, i) => ({ label: 'Page ' + (i + 1), input: p.blob, trim: true })), 'pages'));

$('ocrLang').addEventListener('change', () => {
  try { localStorage.setItem('ocrLang', $('ocrLang').value); } catch (e) { /* stockage indisponible */ }
  if (ocr.sources.length) runOcr(ocr.sources, ocr.returnTo);
});
try {
  const saved = localStorage.getItem('ocrLang');
  if (saved && [...$('ocrLang').options].some((o) => o.value === saved)) $('ocrLang').value = saved;
} catch (e) { /* stockage indisponible */ }

$('btnOcrBack').addEventListener('click', () => show(ocr.returnTo));

$('btnOcrCopy').addEventListener('click', async () => {
  const field = $('ocrText');
  if (!field.value) return;
  try {
    await navigator.clipboard.writeText(field.value);
  } catch (e) {
    field.select();
    document.execCommand('copy');
  }
  toast('Texte copié');
});

function textName() { return pdfName().replace('Scan_', 'Texte_').replace('.pdf', '.txt'); }

$('btnOcrDownload').addEventListener('click', () => {
  const text = $('ocrText').value;
  if (!text) return;
  downloadBlob(new Blob([text], { type: 'text/plain;charset=utf-8' }), textName());
  toast('Texte enregistré dans les téléchargements');
});

$('btnOcrShare').addEventListener('click', async () => {
  const text = $('ocrText').value;
  if (!text) return;
  try {
    if (navigator.share) await navigator.share({ title: 'Texte extrait', text });
    else { downloadBlob(new Blob([text], { type: 'text/plain;charset=utf-8' }), textName()); toast('Partage indisponible, texte téléchargé'); }
  } catch (e) {
    if (e && e.name !== 'AbortError') console.error(e);
  }
});

/* ------------------------------------------------------------------ */
/*  Démarrage                                                          */
/* ------------------------------------------------------------------ */
$('btnShutter').addEventListener('click', () => {
  if (!state.stream) { toast('La caméra n’est pas active. Utilisez « Importer ».'); return; }
  capture();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker :', e));
}

if (DEBUG) $('dbg').style.display = 'block';
updateCount();
show('scan');
initCv();
</script>
